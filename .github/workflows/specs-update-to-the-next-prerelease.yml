name: Specs for updating to the next prerelease
on:
  workflow_call:
    inputs:
      app-client-id:
        type: string
        required: false
    secrets:
      token:
        required: false
      app-private-key:
        required: false
permissions: {}
jobs:
  update-to-the-next-prerelease:
    name: should update a prerelease to the next prerelease of the same version when it is released
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Arrange
      - name: Check out the spec test resources
        uses: actions/checkout@v7
        with:
          path: .update-compose-multiplatform-spec-test-resources
          sparse-checkout: spec-test-resources
          persist-credentials: false
      - name: Set up the calling repository and the fakes
        uses: ./.update-compose-multiplatform-spec-test-resources/spec-test-resources/arrange
        with:
          catalog: with-first-beta.toml
      # Act
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Check the inputs
        uses: ./.update-compose-multiplatform/.github/actions/check-inputs
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          app-client-id: ${{ inputs.app-client-id }}
          auto-merge: disable
          token: ${{ secrets.token }}
          app-private-key: ${{ secrets.app-private-key }}
      - name: Check out the repository
        id: checkout
        uses: ./.update-compose-multiplatform-spec-test-resources/spec-test-resources/fake/actions/checkout
        with:
          ref: main
          persist-credentials: false
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Update the version catalog and yarn.lock
        uses: ./.update-compose-multiplatform/.github/actions/prepare
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          changelog: http://127.0.0.1:8000/changelog/second-beta.md
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
      - name: Upload the update
        uses: ./.update-compose-multiplatform-spec-test-resources/spec-test-resources/fake/actions/upload-artifact
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
          if-no-files-found: error
          retention-days: 1
      - name: Create a token for the app
        id: app-token
        if: inputs.app-client-id != ''
        uses: ./.update-compose-multiplatform-spec-test-resources/spec-test-resources/fake/actions/create-github-app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out the repository
        uses: ./.update-compose-multiplatform-spec-test-resources/spec-test-resources/fake/actions/checkout
        with:
          ref: ${{ steps.checkout.outputs.commit }}
          token: ${{ steps.app-token.outputs.token || secrets.token }}
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Download the update
        uses: ./.update-compose-multiplatform-spec-test-resources/spec-test-resources/fake/actions/download-artifact
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
      - name: Open, update or close the pull request
        uses: ./.update-compose-multiplatform/.github/actions/sync-pull-request
        with:
          repository: octo-org/octo-app
          base: main
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
          token: ${{ steps.app-token.outputs.token || secrets.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          auto-merge: disable
          labels: ""
      # Assert
      - name: Verify the pull request that is opened
        run: |
          jq -n --arg body "$RUNNER_TEMP/update-compose-multiplatform/body.md" '[[
            "pr", "create",
            "--repo", "octo-org/octo-app",
            "--head", "chore/update-compose-multiplatform",
            "--base", "main",
            "--title", "build(deps): update Compose Multiplatform to 1.11.0-beta02",
            "--body-file", $body
          ]]' > "$RUNNER_TEMP/expected-create-calls.json"
          jq -s '[.[] | select(.[0:2] == ["pr", "create"])]' "$RUNNER_TEMP/gh-calls.jsonl" > "$RUNNER_TEMP/create-calls.json"
          diff "$RUNNER_TEMP/expected-create-calls.json" "$RUNNER_TEMP/create-calls.json"
      - name: Verify the pushed version catalog
        run: |
          git -C "$RUNNER_TEMP/origin.git" show chore/update-compose-multiplatform:gradle/libs.versions.toml > "$RUNNER_TEMP/catalog.toml"
          diff .update-compose-multiplatform-spec-test-resources/spec-test-resources/expected/catalog/with-first-beta.toml "$RUNNER_TEMP/catalog.toml"
