name: Update Compose Multiplatform

on:
  workflow_call:
    inputs:
      update-js-yarn-lock:
        type: boolean
        required: false
        default: false
      update-wasm-yarn-lock:
        type: boolean
        required: false
        default: false
      jdk-distribution-to-update-yarn-lock:
        type: string
        required: false
      jdk-version-to-update-yarn-lock:
        type: string
        required: false
      app-client-id:
        type: string
        required: false
      auto-merge:
        type: string
        required: false
        default: disable
      labels:
        type: string
        required: false
    secrets:
      token:
        required: false
      app-private-key:
        required: false

permissions: {}

concurrency:
  group: chore/update-compose-multiplatform
  cancel-in-progress: false

env:
  BASE: ${{ github.event.repository.default_branch }}
  BRANCH: chore/update-compose-multiplatform

jobs:
  check-inputs:
    name: Check the inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out the script
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check the inputs
        env:
          HAS_TOKEN: ${{ secrets.token != '' }}
          HAS_APP_CLIENT_ID: ${{ inputs.app-client-id != '' }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.app-private-key != '' }}
          UPDATE_JS_YARN_LOCK: ${{ inputs.update-js-yarn-lock }}
          UPDATE_WASM_YARN_LOCK: ${{ inputs.update-wasm-yarn-lock }}
          JDK_DISTRIBUTION: ${{ inputs.jdk-distribution-to-update-yarn-lock }}
          JDK_VERSION: ${{ inputs.jdk-version-to-update-yarn-lock }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
        run: kotlin .update-compose-multiplatform/scripts/update-compose-multiplatform.main.kts check-inputs

  prepare:
    name: Update the version catalog and the yarn.lock files
    needs: check-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
      changed: ${{ steps.catalog.outputs.changed }}
      versions: ${{ steps.catalog.outputs.versions }}
      notice: ${{ steps.catalog.outputs.notice }}
    steps:
      - name: Check out the repository
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE }}
          persist-credentials: false

      - name: Check out the script
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: scripts
          persist-credentials: false

      - name: Update the version catalog
        id: catalog
        run: kotlin .update-compose-multiplatform/scripts/update-compose-multiplatform.main.kts update-version-catalog

      - name: Set up the JDK to update the yarn.lock files
        if: steps.catalog.outputs.changed == 'true' && (inputs.update-js-yarn-lock || inputs.update-wasm-yarn-lock)
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.jdk-distribution-to-update-yarn-lock }}
          java-version: ${{ inputs.jdk-version-to-update-yarn-lock }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle
        if: steps.catalog.outputs.changed == 'true' && (inputs.update-js-yarn-lock || inputs.update-wasm-yarn-lock)
        uses: gradle/actions/setup-gradle@v6

      - name: Update the yarn.lock files
        if: steps.catalog.outputs.changed == 'true' && (inputs.update-js-yarn-lock || inputs.update-wasm-yarn-lock)
        env:
          UPDATE_JS_YARN_LOCK: ${{ inputs.update-js-yarn-lock }}
          UPDATE_WASM_YARN_LOCK: ${{ inputs.update-wasm-yarn-lock }}
        run: kotlin .update-compose-multiplatform/scripts/update-compose-multiplatform.main.kts update-yarn-lock

      - name: Save the changes
        if: steps.catalog.outputs.changed == 'true'
        run: kotlin .update-compose-multiplatform/scripts/update-compose-multiplatform.main.kts save-changes

      - name: Upload the changes
        if: steps.catalog.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
          if-no-files-found: error
          retention-days: 1

  open-pull-request:
    name: Open or update the pull request
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create a token for the app
        id: app-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          token: ${{ steps.app-token.outputs.token || secrets.token }}

      - name: Check out the script
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download the changes
        uses: actions/download-artifact@v8
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform

      - name: Push the branch and open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          LABELS: ${{ inputs.labels }}
        run: kotlin .update-compose-multiplatform/scripts/update-compose-multiplatform.main.kts open-pull-request

  close-pull-request:
    name: Close the pull request that is no longer needed
    needs: prepare
    if: needs.prepare.outputs.changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check out the script
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: scripts
          persist-credentials: false

      - name: Find the pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: kotlin .update-compose-multiplatform/scripts/update-compose-multiplatform.main.kts find-pull-request

      - name: Create a token for the app
        id: app-token
        if: steps.find.outputs.number != '' && inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Close the pull request
        if: steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
          NUMBER: ${{ steps.find.outputs.number }}
          VERSIONS: ${{ needs.prepare.outputs.versions }}
        run: kotlin .update-compose-multiplatform/scripts/update-compose-multiplatform.main.kts close-pull-request

  report-material3-adaptive:
    name: Report Material3 Adaptive
    needs: prepare
    if: needs.prepare.outputs.notice != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail with the notice
        env:
          NOTICE: ${{ needs.prepare.outputs.notice }}
        run: |
          echo "::error::$NOTICE"
          exit 1
