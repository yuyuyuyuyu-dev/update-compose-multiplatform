name: Update Compose Multiplatform
on:
  workflow_call:
    inputs:
      jdk-distribution:
        type: string
        default: zulu
      jdk-version:
        type: string
        default: "21"
      project-directory-to-update:
        type: string
      auto-merge:
        type: string
      auto-merge-update-types:
        type: string
      app-client-id:
        type: string
        required: true
    secrets:
      app-private-key:
        required: true
permissions: {}
concurrency:
  group: chore/update-dependencies
  cancel-in-progress: false
jobs:
  update-dependencies:
    name: Update the dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out the tool
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          persist-credentials: false
      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.jdk-version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update the dependencies
        env:
          INPUTS: ${{ toJSON(inputs) }}
        working-directory: .update-compose-multiplatform
        run: ./gradlew --quiet run --args=update
      - name: Hand over the updates
        uses: actions/upload-artifact@v7
        with:
          name: updates
          path: ${{ runner.temp }}/updates.json
          retention-days: 1
  publish-updates:
    name: Publish the updates
    needs: update-dependencies
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create a token for the app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Check out the tool
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          persist-credentials: false
      - name: Receive the updates
        uses: actions/download-artifact@v8
        with:
          name: updates
          path: ${{ runner.temp }}
      - name: Publish the updates
        env:
          INPUTS: ${{ toJSON(inputs) }}
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        working-directory: .update-compose-multiplatform
        run: ./gradlew --quiet run --args=publish
