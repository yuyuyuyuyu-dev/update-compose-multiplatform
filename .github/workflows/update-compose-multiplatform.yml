name: Update Compose Multiplatform
on:
  workflow_call:
    inputs:
      update-js-yarn-lock:
        type: boolean
        required: false
        default: false
      update-wasm-yarn-lock:
        type: boolean
        required: false
        default: false
      jdk-distribution-to-update-yarn-lock:
        type: string
        required: false
      jdk-version-to-update-yarn-lock:
        type: string
        required: false
      app-client-id:
        type: string
        required: false
      auto-merge:
        type: string
        required: false
        default: disable
      labels:
        type: string
        required: false
    secrets:
      token:
        required: false
      app-private-key:
        required: false
permissions: {}
concurrency:
  group: chore/update-compose-multiplatform
  cancel-in-progress: false
env:
  BASE: ${{ github.event.repository.default_branch }}
  BRANCH: chore/update-compose-multiplatform
jobs:
  check-inputs:
    name: Check the inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Check the inputs
        uses: ./.update-compose-multiplatform/.github/actions/check-inputs
        with:
          update-js-yarn-lock: ${{ inputs.update-js-yarn-lock }}
          update-wasm-yarn-lock: ${{ inputs.update-wasm-yarn-lock }}
          jdk-distribution-to-update-yarn-lock: ${{ inputs.jdk-distribution-to-update-yarn-lock }}
          jdk-version-to-update-yarn-lock: ${{ inputs.jdk-version-to-update-yarn-lock }}
          app-client-id: ${{ inputs.app-client-id }}
          auto-merge: ${{ inputs.auto-merge }}
          token: ${{ secrets.token }}
          app-private-key: ${{ secrets.app-private-key }}
  prepare:
    name: Update the version catalog and yarn.lock
    needs: check-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Check out the repository
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE }}
          persist-credentials: false
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Update the version catalog and yarn.lock
        uses: ./.update-compose-multiplatform/.github/actions/prepare
        with:
          update-js-yarn-lock: ${{ inputs.update-js-yarn-lock }}
          update-wasm-yarn-lock: ${{ inputs.update-wasm-yarn-lock }}
          jdk-distribution-to-update-yarn-lock: ${{ inputs.jdk-distribution-to-update-yarn-lock }}
          jdk-version-to-update-yarn-lock: ${{ inputs.jdk-version-to-update-yarn-lock }}
          maven-repository: https://repo1.maven.org/maven2
          changelog: https://raw.githubusercontent.com/JetBrains/compose-multiplatform/master/CHANGELOG.md
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
      - name: Upload the update
        uses: actions/upload-artifact@v7
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
          if-no-files-found: error
          retention-days: 1
  sync-pull-request:
    name: Open, update or close the pull request
    needs: prepare
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create a token for the app
        id: app-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          token: ${{ steps.app-token.outputs.token || secrets.token }}
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Download the update
        uses: actions/download-artifact@v8
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
      - name: Open, update or close the pull request
        uses: ./.update-compose-multiplatform/.github/actions/sync-pull-request
        with:
          repository: ${{ github.repository }}
          base: ${{ env.BASE }}
          branch: ${{ env.BRANCH }}
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
          token: ${{ steps.app-token.outputs.token || secrets.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          auto-merge: ${{ inputs.auto-merge }}
          labels: ${{ inputs.labels }}
