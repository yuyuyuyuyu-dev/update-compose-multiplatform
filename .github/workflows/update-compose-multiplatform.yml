name: Update Compose Multiplatform
on:
  workflow_call:
    inputs:
      project-directory-to-update:
        type: string
        required: false
        default: .
      jdk-distribution:
        type: string
        required: false
        default: zulu
      jdk-version:
        type: string
        required: false
        default: "21"
      app-client-id:
        type: string
        required: false
      auto-merge:
        type: string
        required: false
        default: disable
      auto-merge-update-types:
        type: string
        required: false
      labels:
        type: string
        required: false
    secrets:
      token:
        required: false
      app-private-key:
        required: false
permissions: {}
concurrency:
  group: chore/update-dependencies
  cancel-in-progress: false
jobs:
  update-dependencies:
    name: Update the dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out the script
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: scripts
          persist-credentials: false
      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.jdk-version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update the dependencies
        env:
          PROJECT_DIRECTORY: ${{ inputs.project-directory-to-update }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          AUTO_MERGE_UPDATE_TYPES: ${{ inputs.auto-merge-update-types }}
          UPDATES: ${{ runner.temp }}/updates.json
          COMPOSE_MULTIPLATFORM_CHANGELOG: https://raw.githubusercontent.com/JetBrains/compose-multiplatform/master/CHANGELOG.md
          MAVEN_REPOSITORIES: |
            https://repo.maven.apache.org/maven2
            https://dl.google.com/dl/android/maven2
            https://plugins.gradle.org/m2
        run: kotlin .update-compose-multiplatform/scripts/update-compose-multiplatform.main.kts update
      - name: Hand over the updates
        uses: actions/upload-artifact@v7
        with:
          name: updates
          path: ${{ runner.temp }}/updates.json
          retention-days: 1
  publish-updates:
    name: Publish the updates
    needs: update-dependencies
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create a token for the app
        id: app-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token || secrets.token }}
      - name: Check out the script
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: scripts
          persist-credentials: false
      - name: Receive the updates
        uses: actions/download-artifact@v8
        with:
          name: updates
          path: ${{ runner.temp }}/updates
      - name: Publish the updates
        env:
          PROJECT_DIRECTORY: ${{ inputs.project-directory-to-update }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          AUTO_MERGE_UPDATE_TYPES: ${{ inputs.auto-merge-update-types }}
          UPDATES: ${{ runner.temp }}/updates/updates.json
          LABELS: ${{ inputs.labels }}
          TOKEN: ${{ secrets.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BASE: ${{ github.event.repository.default_branch }}
          COMPOSE_MULTIPLATFORM_CHANGELOG: https://raw.githubusercontent.com/JetBrains/compose-multiplatform/master/CHANGELOG.md
          MAVEN_REPOSITORIES: |
            https://repo.maven.apache.org/maven2
            https://dl.google.com/dl/android/maven2
            https://plugins.gradle.org/m2
        run: kotlin .update-compose-multiplatform/scripts/update-compose-multiplatform.main.kts publish
