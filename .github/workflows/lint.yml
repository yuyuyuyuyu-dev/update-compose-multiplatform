name: Lint
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions: {}
jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download Detekt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/detekt-cli.jar" https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          echo "2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1  $RUNNER_TEMP/detekt-cli.jar" | sha256sum --check --strict
      - name: Run Detekt
        run: java -jar "$RUNNER_TEMP/detekt-cli.jar"
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ktlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/ktlint" https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          echo "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  $RUNNER_TEMP/bin/ktlint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/ktlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run ktlint
        run: ktlint
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint
  yamlfmt:
    name: yamlfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install yamlfmt
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/yamlfmt.tar.gz" https://github.com/google/yamlfmt/releases/download/v0.21.0/yamlfmt_0.21.0_Linux_x86_64.tar.gz
          echo "1f300d9257b232bb3b541d7fb1b0e6b3c121bcbab381c86cd38cb8722be8a566  $RUNNER_TEMP/yamlfmt.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/yamlfmt.tar.gz" -C "$RUNNER_TEMP/bin" yamlfmt
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run yamlfmt
        run: yamlfmt -lint .
