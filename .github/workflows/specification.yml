name: Specification
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions: {}
jobs:
  update-version-catalog:
    name: should update Compose Multiplatform and its related libraries in the right combination
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Arrange
      - name: Check out the tests
        uses: actions/checkout@v7
        with:
          path: .update-compose-multiplatform-test
          sparse-checkout: test
          persist-credentials: false
      - name: Set up the calling repository and the fakes
        uses: ./.update-compose-multiplatform-test/test/arrange
      # Act
      # check-inputs
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Check the inputs
        uses: ./.update-compose-multiplatform/.github/actions/check-inputs
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          app-client-id: ""
          auto-merge: disable
          token: fake-token
          app-private-key: ""
      # prepare
      - name: Check out the repository
        id: checkout
        uses: ./.update-compose-multiplatform-test/test/fake/actions/checkout
        with:
          ref: main
          persist-credentials: false
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Update the version catalog and the yarn.lock files
        uses: ./.update-compose-multiplatform/.github/actions/prepare
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          maven-repository: http://127.0.0.1:8000/maven-central
          changelog: http://127.0.0.1:8000/changelog/paired.md
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
      - name: Upload the update
        uses: ./.update-compose-multiplatform-test/test/fake/actions/upload-artifact
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
          if-no-files-found: error
          retention-days: 1
      # sync-pull-request
      - name: Create a token for the app
        id: app-token
        if: "'' != ''"
        uses: ./.update-compose-multiplatform-test/test/fake/actions/create-github-app-token
        with:
          client-id: ""
          private-key: ""
          permission-contents: write
          permission-pull-requests: write
      - name: Check out the repository
        uses: ./.update-compose-multiplatform-test/test/fake/actions/checkout
        with:
          ref: ${{ steps.checkout.outputs.commit }}
          token: ${{ steps.app-token.outputs.token || 'fake-token' }}
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Download the update
        uses: ./.update-compose-multiplatform-test/test/fake/actions/download-artifact
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
      - name: Open, update or close the pull request
        uses: ./.update-compose-multiplatform/.github/actions/sync-pull-request
        with:
          repository: octo-org/octo-app
          base: main
          branch: chore/update-compose-multiplatform
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
          token: ${{ steps.app-token.outputs.token || 'fake-token' }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          auto-merge: disable
          labels: ""
      # Assert
      - name: Verify the pull request that is opened
        run: |
          jq -n --arg body "$RUNNER_TEMP/update-compose-multiplatform/body.md" '[[
            "pr", "create",
            "--repo", "octo-org/octo-app",
            "--head", "chore/update-compose-multiplatform",
            "--base", "main",
            "--title", "build(deps): update Compose Multiplatform to 1.10.1, material3 to 1.10.0-alpha06 and Material3 Adaptive to 1.2.0",
            "--body-file", $body
          ]]' > "$RUNNER_TEMP/expected-create-calls.json"
          jq -s '[.[] | select(.[0:2] == ["pr", "create"])]' "$RUNNER_TEMP/gh-calls.jsonl" > "$RUNNER_TEMP/create-calls.json"
          diff "$RUNNER_TEMP/expected-create-calls.json" "$RUNNER_TEMP/create-calls.json"
      - name: Verify the pull request body
        run: diff .update-compose-multiplatform-test/test/expected/pull-request-body/with-material3-adaptive.md "$RUNNER_TEMP/update-compose-multiplatform/body.md"
      - name: Verify the pushed version catalog
        run: |
          git -C "$RUNNER_TEMP/origin.git" show chore/update-compose-multiplatform:gradle/libs.versions.toml > "$RUNNER_TEMP/catalog.toml"
          diff .update-compose-multiplatform-test/test/expected/catalog/with-material3-adaptive.toml "$RUNNER_TEMP/catalog.toml"
  update-yarn-lock:
    name: should update yarn.lock when it is requested
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Arrange
      - name: Check out the tests
        uses: actions/checkout@v7
        with:
          path: .update-compose-multiplatform-test
          sparse-checkout: test
          persist-credentials: false
      - name: Set up the calling repository and the fakes
        uses: ./.update-compose-multiplatform-test/test/arrange
      # Act
      # check-inputs
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Check the inputs
        uses: ./.update-compose-multiplatform/.github/actions/check-inputs
        with:
          update-js-yarn-lock: true
          update-wasm-yarn-lock: true
          jdk-distribution-to-update-yarn-lock: zulu
          jdk-version-to-update-yarn-lock: "21"
          app-client-id: ""
          auto-merge: disable
          token: fake-token
          app-private-key: ""
      # prepare
      - name: Check out the repository
        id: checkout
        uses: ./.update-compose-multiplatform-test/test/fake/actions/checkout
        with:
          ref: main
          persist-credentials: false
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Update the version catalog and the yarn.lock files
        uses: ./.update-compose-multiplatform/.github/actions/prepare
        with:
          update-js-yarn-lock: true
          update-wasm-yarn-lock: true
          jdk-distribution-to-update-yarn-lock: zulu
          jdk-version-to-update-yarn-lock: "21"
          maven-repository: http://127.0.0.1:8000/maven-central
          changelog: http://127.0.0.1:8000/changelog/paired.md
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
      - name: Upload the update
        uses: ./.update-compose-multiplatform-test/test/fake/actions/upload-artifact
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
          if-no-files-found: error
          retention-days: 1
      # sync-pull-request
      - name: Create a token for the app
        id: app-token
        if: "'' != ''"
        uses: ./.update-compose-multiplatform-test/test/fake/actions/create-github-app-token
        with:
          client-id: ""
          private-key: ""
          permission-contents: write
          permission-pull-requests: write
      - name: Check out the repository
        uses: ./.update-compose-multiplatform-test/test/fake/actions/checkout
        with:
          ref: ${{ steps.checkout.outputs.commit }}
          token: ${{ steps.app-token.outputs.token || 'fake-token' }}
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Download the update
        uses: ./.update-compose-multiplatform-test/test/fake/actions/download-artifact
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
      - name: Open, update or close the pull request
        uses: ./.update-compose-multiplatform/.github/actions/sync-pull-request
        with:
          repository: octo-org/octo-app
          base: main
          branch: chore/update-compose-multiplatform
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
          token: ${{ steps.app-token.outputs.token || 'fake-token' }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          auto-merge: disable
          labels: ""
      # Assert
      - name: Verify the pushed yarn.lock files
        run: |
          echo "Upgraded by kotlinUpgradeYarnLock" > "$RUNNER_TEMP/expected-js-yarn.lock"
          git -C "$RUNNER_TEMP/origin.git" show chore/update-compose-multiplatform:kotlin-js-store/yarn.lock > "$RUNNER_TEMP/js-yarn.lock"
          diff "$RUNNER_TEMP/expected-js-yarn.lock" "$RUNNER_TEMP/js-yarn.lock"
          echo "Upgraded by kotlinWasmUpgradeYarnLock" > "$RUNNER_TEMP/expected-wasm-yarn.lock"
          git -C "$RUNNER_TEMP/origin.git" show chore/update-compose-multiplatform:kotlin-js-store/wasm/yarn.lock > "$RUNNER_TEMP/wasm-yarn.lock"
          diff "$RUNNER_TEMP/expected-wasm-yarn.lock" "$RUNNER_TEMP/wasm-yarn.lock"
      - name: Verify the pull request body
        run: |
          echo "- The yarn.lock files were updated with \`./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock\`." > "$RUNNER_TEMP/expected-yarn-lock-lines.txt"
          sed -n '/yarn\.lock/p' "$RUNNER_TEMP/update-compose-multiplatform/body.md" > "$RUNNER_TEMP/yarn-lock-lines.txt"
          diff "$RUNNER_TEMP/expected-yarn-lock-lines.txt" "$RUNNER_TEMP/yarn-lock-lines.txt"
  enable-auto-merge:
    name: should enable auto-merge when it is requested
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Arrange
      - name: Check out the tests
        uses: actions/checkout@v7
        with:
          path: .update-compose-multiplatform-test
          sparse-checkout: test
          persist-credentials: false
      - name: Set up the calling repository and the fakes
        uses: ./.update-compose-multiplatform-test/test/arrange
      # Act
      # check-inputs
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Check the inputs
        uses: ./.update-compose-multiplatform/.github/actions/check-inputs
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          app-client-id: ""
          auto-merge: squash
          token: fake-token
          app-private-key: ""
      # prepare
      - name: Check out the repository
        id: checkout
        uses: ./.update-compose-multiplatform-test/test/fake/actions/checkout
        with:
          ref: main
          persist-credentials: false
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Update the version catalog and the yarn.lock files
        uses: ./.update-compose-multiplatform/.github/actions/prepare
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          maven-repository: http://127.0.0.1:8000/maven-central
          changelog: http://127.0.0.1:8000/changelog/paired.md
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
      - name: Upload the update
        uses: ./.update-compose-multiplatform-test/test/fake/actions/upload-artifact
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
          if-no-files-found: error
          retention-days: 1
      # sync-pull-request
      - name: Create a token for the app
        id: app-token
        if: "'' != ''"
        uses: ./.update-compose-multiplatform-test/test/fake/actions/create-github-app-token
        with:
          client-id: ""
          private-key: ""
          permission-contents: write
          permission-pull-requests: write
      - name: Check out the repository
        uses: ./.update-compose-multiplatform-test/test/fake/actions/checkout
        with:
          ref: ${{ steps.checkout.outputs.commit }}
          token: ${{ steps.app-token.outputs.token || 'fake-token' }}
      - name: Check out the actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .update-compose-multiplatform
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - name: Download the update
        uses: ./.update-compose-multiplatform-test/test/fake/actions/download-artifact
        with:
          name: update-compose-multiplatform
          path: ${{ runner.temp }}/update-compose-multiplatform
      - name: Open, update or close the pull request
        uses: ./.update-compose-multiplatform/.github/actions/sync-pull-request
        with:
          repository: octo-org/octo-app
          base: main
          branch: chore/update-compose-multiplatform
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
          token: ${{ steps.app-token.outputs.token || 'fake-token' }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          auto-merge: squash
          labels: ""
      # Assert
      - name: Verify the calls to gh that turn on auto-merge
        run: |
          jq -n '[["pr", "merge", "https://github.com/octo-org/octo-app/pull/1", "--auto", "--squash"]]' > "$RUNNER_TEMP/expected-merge-calls.json"
          jq -s '[.[] | select(.[0:2] == ["pr", "merge"])]' "$RUNNER_TEMP/gh-calls.jsonl" > "$RUNNER_TEMP/merge-calls.json"
          diff "$RUNNER_TEMP/expected-merge-calls.json" "$RUNNER_TEMP/merge-calls.json"
