name: Specification
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions: {}
env:
  REPOSITORY: octo-org/octo-app
  BASE: main
  BRANCH: chore/update-compose-multiplatform
jobs:
  update-version-catalog:
    name: should update Compose Multiplatform and the related libraries that have to match its version in the right combination
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Arrange
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: .update-compose-multiplatform
          persist-credentials: false
      - name: Create the calling repository
        env:
          CATALOG: with-material3-adaptive.toml
        run: |
          git init --quiet --bare --initial-branch=main "$RUNNER_TEMP/origin.git"
          cp -R .update-compose-multiplatform/test/fixture "$RUNNER_TEMP/fixture"
          mkdir -p "$RUNNER_TEMP/fixture/gradle"
          cp ".update-compose-multiplatform/test/catalog/$CATALOG" "$RUNNER_TEMP/fixture/gradle/libs.versions.toml"
          git -C "$RUNNER_TEMP/fixture" init --quiet --initial-branch=main
          git -C "$RUNNER_TEMP/fixture" add --all
          git -C "$RUNNER_TEMP/fixture" -c user.name=Octocat -c user.email=octocat@example.com commit --quiet --message "Add the version catalog"
          git -C "$RUNNER_TEMP/fixture" push --quiet "$RUNNER_TEMP/origin.git" main
      - name: Start the fake Maven Central and CHANGELOG
        run: |
          "$JAVA_HOME_21_X64/bin/jwebserver" --bind-address 127.0.0.1 --port 8000 --directory "$GITHUB_WORKSPACE/.update-compose-multiplatform/test/fake" > "$RUNNER_TEMP/fake-server.log" 2>&1 &
          curl --silent --show-error --fail --retry 10 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:8000/
      - name: Create empty logs for the fakes
        run: touch "$RUNNER_TEMP/gh-calls.jsonl" "$RUNNER_TEMP/gradlew-calls.jsonl" "$RUNNER_TEMP/gradlew-jdks.jsonl"
      - name: Put the fake gh first on the PATH
        run: echo "$GITHUB_WORKSPACE/.update-compose-multiplatform/test/fake/bin" >> "$GITHUB_PATH"
      # Act
      - name: Check the inputs
        uses: ./.update-compose-multiplatform/.github/actions/check-inputs
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          app-client-id: ""
          auto-merge: disable
          token: fake-token
          app-private-key: ""
      - name: Check out the calling repository
        id: checkout
        run: |
          git init --quiet --initial-branch=main
          git remote add origin "$RUNNER_TEMP/origin.git"
          git fetch --quiet origin
          git checkout --quiet --force -B main origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Update the version catalog and the yarn.lock files
        uses: ./.update-compose-multiplatform/.github/actions/prepare
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          maven-repository: http://127.0.0.1:8000/maven-central
          changelog: http://127.0.0.1:8000/changelog/paired.md
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
      - name: Check out the calling repository at the prepared commit
        env:
          COMMIT: ${{ steps.checkout.outputs.commit }}
        run: git checkout --quiet --force --detach "$COMMIT"
      - name: Open, update or close the pull request
        uses: ./.update-compose-multiplatform/.github/actions/sync-pull-request
        with:
          repository: ${{ env.REPOSITORY }}
          base: ${{ env.BASE }}
          branch: ${{ env.BRANCH }}
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
          token: fake-token
          app-slug: ""
          auto-merge: disable
          labels: ""
      # Assert
      - name: Verify the pull request that is opened
        run: |
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg base "$BASE" \
            --arg branch "$BRANCH" \
            --arg title "build(deps): update Compose Multiplatform to 1.10.1, material3 to 1.10.0-alpha06 and Material3 Adaptive to 1.2.0" \
            --arg body "$RUNNER_TEMP/update-compose-multiplatform/body.md" \
            '[["pr", "create", "--repo", $repository, "--head", $branch, "--base", $base, "--title", $title, "--body-file", $body]]' > "$RUNNER_TEMP/expected-create-calls.json"
          jq -s '[.[] | select(.[0:2] == ["pr", "create"])]' "$RUNNER_TEMP/gh-calls.jsonl" > "$RUNNER_TEMP/create-calls.json"
          diff "$RUNNER_TEMP/expected-create-calls.json" "$RUNNER_TEMP/create-calls.json"
      - name: Verify the pull request body
        run: diff .update-compose-multiplatform/test/expected/pull-request-body/with-material3-adaptive.md "$RUNNER_TEMP/update-compose-multiplatform/body.md"
      - name: Verify the pushed version catalog
        env:
          CATALOG: with-material3-adaptive.toml
        run: |
          git -C "$RUNNER_TEMP/origin.git" show "$BRANCH:gradle/libs.versions.toml" > "$RUNNER_TEMP/catalog.toml"
          diff ".update-compose-multiplatform/test/expected/catalog/$CATALOG" "$RUNNER_TEMP/catalog.toml"
  update-yarn-lock:
    name: should update yarn.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Arrange
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: .update-compose-multiplatform
          persist-credentials: false
      - name: Create the calling repository
        env:
          CATALOG: with-material3-adaptive.toml
        run: |
          git init --quiet --bare --initial-branch=main "$RUNNER_TEMP/origin.git"
          cp -R .update-compose-multiplatform/test/fixture "$RUNNER_TEMP/fixture"
          mkdir -p "$RUNNER_TEMP/fixture/gradle"
          cp ".update-compose-multiplatform/test/catalog/$CATALOG" "$RUNNER_TEMP/fixture/gradle/libs.versions.toml"
          git -C "$RUNNER_TEMP/fixture" init --quiet --initial-branch=main
          git -C "$RUNNER_TEMP/fixture" add --all
          git -C "$RUNNER_TEMP/fixture" -c user.name=Octocat -c user.email=octocat@example.com commit --quiet --message "Add the version catalog"
          git -C "$RUNNER_TEMP/fixture" push --quiet "$RUNNER_TEMP/origin.git" main
      - name: Start the fake Maven Central and CHANGELOG
        run: |
          "$JAVA_HOME_21_X64/bin/jwebserver" --bind-address 127.0.0.1 --port 8000 --directory "$GITHUB_WORKSPACE/.update-compose-multiplatform/test/fake" > "$RUNNER_TEMP/fake-server.log" 2>&1 &
          curl --silent --show-error --fail --retry 10 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:8000/
      - name: Create empty logs for the fakes
        run: touch "$RUNNER_TEMP/gh-calls.jsonl" "$RUNNER_TEMP/gradlew-calls.jsonl" "$RUNNER_TEMP/gradlew-jdks.jsonl"
      - name: Put the fake gh first on the PATH
        run: echo "$GITHUB_WORKSPACE/.update-compose-multiplatform/test/fake/bin" >> "$GITHUB_PATH"
      # Act
      - name: Check the inputs
        uses: ./.update-compose-multiplatform/.github/actions/check-inputs
        with:
          update-js-yarn-lock: true
          update-wasm-yarn-lock: true
          jdk-distribution-to-update-yarn-lock: zulu
          jdk-version-to-update-yarn-lock: "21"
          app-client-id: ""
          auto-merge: disable
          token: fake-token
          app-private-key: ""
      - name: Check out the calling repository
        id: checkout
        run: |
          git init --quiet --initial-branch=main
          git remote add origin "$RUNNER_TEMP/origin.git"
          git fetch --quiet origin
          git checkout --quiet --force -B main origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Update the version catalog and the yarn.lock files
        uses: ./.update-compose-multiplatform/.github/actions/prepare
        with:
          update-js-yarn-lock: true
          update-wasm-yarn-lock: true
          jdk-distribution-to-update-yarn-lock: zulu
          jdk-version-to-update-yarn-lock: "21"
          maven-repository: http://127.0.0.1:8000/maven-central
          changelog: http://127.0.0.1:8000/changelog/paired.md
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
      - name: Check out the calling repository at the prepared commit
        env:
          COMMIT: ${{ steps.checkout.outputs.commit }}
        run: git checkout --quiet --force --detach "$COMMIT"
      - name: Open, update or close the pull request
        uses: ./.update-compose-multiplatform/.github/actions/sync-pull-request
        with:
          repository: ${{ env.REPOSITORY }}
          base: ${{ env.BASE }}
          branch: ${{ env.BRANCH }}
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
          token: fake-token
          app-slug: ""
          auto-merge: disable
          labels: ""
      # Assert
      - name: Verify the pushed yarn.lock files
        run: |
          echo "Upgraded by kotlinUpgradeYarnLock" > "$RUNNER_TEMP/expected-js-yarn.lock"
          git -C "$RUNNER_TEMP/origin.git" show "$BRANCH:kotlin-js-store/yarn.lock" > "$RUNNER_TEMP/js-yarn.lock"
          diff "$RUNNER_TEMP/expected-js-yarn.lock" "$RUNNER_TEMP/js-yarn.lock"
          echo "Upgraded by kotlinWasmUpgradeYarnLock" > "$RUNNER_TEMP/expected-wasm-yarn.lock"
          git -C "$RUNNER_TEMP/origin.git" show "$BRANCH:kotlin-js-store/wasm/yarn.lock" > "$RUNNER_TEMP/wasm-yarn.lock"
          diff "$RUNNER_TEMP/expected-wasm-yarn.lock" "$RUNNER_TEMP/wasm-yarn.lock"
      - name: Verify the pull request body
        run: |
          echo "- The yarn.lock files were updated with \`./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock\`." > "$RUNNER_TEMP/expected-yarn-lock-lines.txt"
          sed -n '/yarn\.lock/p' "$RUNNER_TEMP/update-compose-multiplatform/body.md" > "$RUNNER_TEMP/yarn-lock-lines.txt"
          diff "$RUNNER_TEMP/expected-yarn-lock-lines.txt" "$RUNNER_TEMP/yarn-lock-lines.txt"
  enable-auto-merge:
    name: should enable auto-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Arrange
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: .update-compose-multiplatform
          persist-credentials: false
      - name: Create the calling repository
        env:
          CATALOG: with-material3-adaptive.toml
        run: |
          git init --quiet --bare --initial-branch=main "$RUNNER_TEMP/origin.git"
          cp -R .update-compose-multiplatform/test/fixture "$RUNNER_TEMP/fixture"
          mkdir -p "$RUNNER_TEMP/fixture/gradle"
          cp ".update-compose-multiplatform/test/catalog/$CATALOG" "$RUNNER_TEMP/fixture/gradle/libs.versions.toml"
          git -C "$RUNNER_TEMP/fixture" init --quiet --initial-branch=main
          git -C "$RUNNER_TEMP/fixture" add --all
          git -C "$RUNNER_TEMP/fixture" -c user.name=Octocat -c user.email=octocat@example.com commit --quiet --message "Add the version catalog"
          git -C "$RUNNER_TEMP/fixture" push --quiet "$RUNNER_TEMP/origin.git" main
      - name: Start the fake Maven Central and CHANGELOG
        run: |
          "$JAVA_HOME_21_X64/bin/jwebserver" --bind-address 127.0.0.1 --port 8000 --directory "$GITHUB_WORKSPACE/.update-compose-multiplatform/test/fake" > "$RUNNER_TEMP/fake-server.log" 2>&1 &
          curl --silent --show-error --fail --retry 10 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:8000/
      - name: Create empty logs for the fakes
        run: touch "$RUNNER_TEMP/gh-calls.jsonl" "$RUNNER_TEMP/gradlew-calls.jsonl" "$RUNNER_TEMP/gradlew-jdks.jsonl"
      - name: Put the fake gh first on the PATH
        run: echo "$GITHUB_WORKSPACE/.update-compose-multiplatform/test/fake/bin" >> "$GITHUB_PATH"
      # Act
      - name: Check the inputs
        uses: ./.update-compose-multiplatform/.github/actions/check-inputs
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          app-client-id: ""
          auto-merge: squash
          token: fake-token
          app-private-key: ""
      - name: Check out the calling repository
        id: checkout
        run: |
          git init --quiet --initial-branch=main
          git remote add origin "$RUNNER_TEMP/origin.git"
          git fetch --quiet origin
          git checkout --quiet --force -B main origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Update the version catalog and the yarn.lock files
        uses: ./.update-compose-multiplatform/.github/actions/prepare
        with:
          update-js-yarn-lock: false
          update-wasm-yarn-lock: false
          jdk-distribution-to-update-yarn-lock: ""
          jdk-version-to-update-yarn-lock: ""
          maven-repository: http://127.0.0.1:8000/maven-central
          changelog: http://127.0.0.1:8000/changelog/paired.md
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
      - name: Check out the calling repository at the prepared commit
        env:
          COMMIT: ${{ steps.checkout.outputs.commit }}
        run: git checkout --quiet --force --detach "$COMMIT"
      - name: Open, update or close the pull request
        uses: ./.update-compose-multiplatform/.github/actions/sync-pull-request
        with:
          repository: ${{ env.REPOSITORY }}
          base: ${{ env.BASE }}
          branch: ${{ env.BRANCH }}
          update-directory: ${{ runner.temp }}/update-compose-multiplatform
          token: fake-token
          app-slug: ""
          auto-merge: squash
          labels: ""
      # Assert
      - name: Verify the calls to gh that turn on auto-merge
        run: |
          jq -n '[["pr", "merge", "https://github.com/octo-org/octo-app/pull/1", "--auto", "--squash"]]' > "$RUNNER_TEMP/expected-merge-calls.json"
          jq -s '[.[] | select(.[0:2] == ["pr", "merge"])]' "$RUNNER_TEMP/gh-calls.jsonl" > "$RUNNER_TEMP/merge-calls.json"
          diff "$RUNNER_TEMP/expected-merge-calls.json" "$RUNNER_TEMP/merge-calls.json"
