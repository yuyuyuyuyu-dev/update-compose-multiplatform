name: Specification
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions: {}
jobs:
  github-app:
    name: GitHub App
    permissions:
      contents: read
    uses: ./.github/workflows/specification-jobs.yml
    with:
      app-client-id: fake-client-id
    secrets:
      app-private-key: fake-private-key
