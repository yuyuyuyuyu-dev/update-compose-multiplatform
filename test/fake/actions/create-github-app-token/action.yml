name: Create GitHub App Token
inputs:
  client-id:
    required: true
  private-key:
    required: true
  permission-contents:
    required: false
  permission-pull-requests:
    required: false
outputs:
  token:
    value: ${{ steps.token.outputs.token }}
  app-slug:
    value: ${{ steps.token.outputs.app-slug }}
runs:
  using: composite
  steps:
    - name: Create a fake token
      id: token
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.client-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
          echo "The client-id and private-key inputs are required." >&2
          exit 1
        fi
        echo "token=fake-app-token" >> "$GITHUB_OUTPUT"
        echo "app-slug=fake-app" >> "$GITHUB_OUTPUT"
